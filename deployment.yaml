
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-appointment-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hospital-appointment-portal
  template:
    metadata:
      labels:
        app: hospital-appointment-portal
    spec:
      containers:
        - name: hospital-appointment-portal
          image: balaji00002/hospital-appointment-portal:v1
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: hospital-appointment-service
spec:
  type: NodePort
  selector:
    app: hospital-appointment-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085
